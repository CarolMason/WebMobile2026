<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="author" content= "Carolina Mason, Dhara Dantas, Giovanna Cseri e Natalia Ramos"/>
	<link rel="stylesheet" href="Style.css">
	<title> Carona U</title>
</head>
<body>
	<header>
		<h1> CaronaU</h1>
		<button id="botao-login" class="botao-login">Login</button>
		<nav>
			<ul>
				<li><a href="#cadastro">Cadastro</a></li>
				<li><a href="#busca">Buscar carona</a></li>
				<li><a href="Historico.html">Histórico</a></li>
				<li class= "nav-item"><a class="nav-link" href="Sobre.html">Sobre</a></li>

			</ul>
		</nav>
	</header>
	<main>
		<div id="mensagem-login" class="mensagem-flutuante escondido"></div>
		<section id="cadastro">
			<h2> Cadastro de usuário</h2>
			<form>
				<label for="nome">Nome:</label>
				<input type="text" id="nome" name="nome">

				<label for="faculdade">Faculdade:</label>
				<input type="text" id="faculdade" name="faculdade">

				<label for="localizacao">Localização:</label>
				<input type="text" id="localizacao" name="localizacao">

				<label for="email">E-mail:</label>
				<input type="text" id="email" name="email">

				<button class="button-submit" type="submit">Cadastrar</button>
			</form>
		</section>

		<section id="busca">
			<h2> Buscar carona</h2>
			<p class="texto-ajuda">Encontre um caminho como o seu</p>

			<form>
				<label for="destino">Destino:</label>
				<input type="text" id="destino" name="destino">

				<label for="horario">Horário:</label>
				<input type="time" id="horario" name="horario">

				<label for="partida">Ponto de partida:</label>
				<input type="text" id="partida" name="partida">

				<button class="button-submit" type="submit">Buscar carona</button>
			</form>
		</section>
	</main>
	<script src="script.js"></script>
	</body>
	</html>
